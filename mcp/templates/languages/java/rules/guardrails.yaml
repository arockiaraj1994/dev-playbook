contributes_to: core/guardrails.md
section: Java

rules:
  - id: no-swallowed-exceptions
    group: must_not
    severity: hard
    title: Never leave a catch block empty
    body: >-
      An empty catch block is a defect. Handle the exception, wrap and
      rethrow it with context, or let it propagate - never discard it
      silently.
    help: >-
      An empty catch converts a failure into a wrong answer: the call did not work,
      nothing recorded that, and the caller proceeds as if it had. The resulting bug
      surfaces far away with no trace back to the cause. If you genuinely expect and
      accept the exception, say so in a comment and log it; otherwise wrap it with
      context and rethrow.
    example:
      bad: |
        try {
            cache.evict(key);
        } catch (Exception e) {
        }   // silence
      good: |
        try {
            cache.evict(key);
        } catch (CacheUnavailable e) {
            // Best-effort: a stale entry expires on its own within 60s.
            log.debug("evict failed for {}", key, e);
        }

  - id: no-raw-types
    group: must_not
    severity: soft
    title: Always give a generic type its parameter
    body: >-
      Always parameterize generic types. A raw `List` defeats compile-time
      checking and forces unchecked casts on every use.
    help: >-
      A raw type turns off generic checking for every use of that reference, not just
      the line that omitted the parameter, so the compiler stops catching the mismatches
      it exists to catch. The error moves to runtime as a ClassCastException in a stack
      frame that never mentions the assignment that caused it. Use a wildcard when the
      parameter is genuinely unknown.
    example:
      bad: |
        List names = repo.findAll();
        for (Object o : names) {
            String s = (String) o;    // ClassCastException at runtime
        }
      good: |
        List<String> names = repo.findAll();
        for (String s : names) { ... }
        // or List<?> when the element type is genuinely unknown

  - id: no-mutable-shared-state
    group: must_not
    severity: hard
    title: Guard any state shared between threads
    body: >-
      State reachable from more than one thread is immutable, confined, or
      guarded by an explicit synchronization mechanism. Prefer
      `java.util.concurrent` types over hand-rolled locking.
    help: >-
      Without synchronization there is no guarantee one thread ever sees another's
      writes, so a race is not merely a matter of interleaving: a value can stay stale
      indefinitely. These bugs are load-dependent and rarely reproduce in a test. Prefer
      immutability first and confinement second, and reach for java.util.concurrent
      rather than hand-rolled locking when you do need sharing.
    example:
      bad: |
        class Counter {
            private int count;                 // written from several threads
            void increment() { count++; }      // read-modify-write, unsynchronized
        }
      good: |
        class Counter {
            private final AtomicInteger count = new AtomicInteger();
            void increment() { count.incrementAndGet(); }
        }

  - id: no-null-returns-for-collections
    group: must_not
    severity: soft
    title: Return an empty list instead of null
    body: >-
      Return an empty collection rather than null. Use `Optional` for a
      genuinely absent single value, and never return `Optional` from a
      field or collection.
    help: >-
      A null collection makes every caller write a null check before every loop, and the
      one that forgets gets an NPE far from the method that returned it. An empty
      collection composes: it iterates zero times and streams to nothing. Optional is
      for a single value that may be absent, and belongs only in a return position,
      never on a field or as a collection element.
    example:
      bad: |
        List<Order> findByCustomer(CustomerId id) {
            if (!exists(id)) return null;      // every caller must guard
        }
      good: |
        List<Order> findByCustomer(CustomerId id) {
            if (!exists(id)) return List.of();
        }
        Optional<Order> findById(OrderId id) { ... }   // single value, may be absent
